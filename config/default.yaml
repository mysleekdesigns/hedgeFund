# hedgeFund defaults. CLI flags override these; nothing is hard-coded twice.
# Source: plan.md section 5 (Key parameters and defaults).
states: [Bear, Sideways, Bull]   # canonical order; every matrix and vector in the repo uses this index order

labelling:
  window: 20            # trading days of trailing return; video default (section 5), also expose 10 / 60
  threshold: 0.05       # +/-5% trailing return -> Bull / Bear (section 5); the on-camera prompt used 0.02
  return_type: simple   # simple | log; Pine uses log, the companion script uses simple (section 5)
  threshold_bull: null  # optional asymmetric override of +threshold (Phase 2 fix); null = symmetric
  threshold_bear: null  # optional asymmetric override of -threshold (Phase 2 fix); null = symmetric

data:
  years: 10             # history length when fetching a ticker (section 5)
  source: yfinance      # yfinance | alpaca | csv; all three exist, yfinance needs no key; pass --source alpaca to use APCA_* keys (section 3)
  cache_dir: cache      # parquet cache keyed by source, symbol, start, end (rules/data-sources.md)
  alpaca:               # keys come only from APCA_API_KEY_ID / APCA_API_SECRET_KEY in the environment at call time, never from this file
                        # account reads use paper-api.alpaca.markets only; market data is read-only from data.alpaca.markets (rules/trading-safety.md)
    feed: iex           # free IEX feed for paper accounts; IEX closes approximate the consolidated close, sip (paid) matches it
    adjustment: all     # splits + dividends, matches yfinance auto_adjust=True so dates and adjustments align

backtest:
  min_train: 252        # one trading year of history before the walk-forward starts (section 5)
  refit: expanding      # expanding | rolling; expanding is the companion's behaviour (section 5)
  rolling_bars: 756     # rolling refit window, 3 trading years (3 * 252) when refit is rolling (section 5)
  rule: sign            # sign | conviction | persistence | long_only; sign is the Phase 1 rule (Phase 3)
  dead_band: 0.0        # rebalance only when |target - held| exceeds this; 0 = every change, Phase 1 behaviour (Fix 6)
  horizons: [1, 5, 10, 20]  # per-horizon P&L reporting: 1 day, 1 week, 2 weeks, 1 month (Fix 6)
  holdout_years: 2      # the last two years are never used for parameter selection and are reported separately (Fix 6)
  lag_order: 20         # a turning point is the extreme within +/-20 bars, the labeller window (Fix 3)
  cost_sensitivity_bps: [0, 5, 10, 20, 50]  # per-side cost levels of the sensitivity table (Fix 6)
  sensitivity:
    windows: [10, 20, 60]                    # window axis of the net-Sharpe heatmap: the three windows section 5 exposes
    thresholds: [0.02, 0.03, 0.05, 0.07, 0.10]  # threshold axis: 0.02 on-camera, 0.05 default, wider for the overfit check (Fix 6)

statistics:
  null_paths: 1000      # shuffled-label / random-sign null paths for percentile ranking (section 5)
  bootstrap:
    block_days: 20      # block length for the stationary block bootstrap (section 5)
    resamples: 500      # bootstrap resamples (section 5)
  rolling_bars: 756     # 3 trading years (3 * 252) for the rolling matrix next to the full fit (Fix 4)
  ew_half_life: 250     # ~1 trading year half-life for exponentially weighted transition counts (Fix 4)
  shrinkage_alpha: 20   # Dirichlet pseudo-counts per row, ~1 month of daily transitions (Fix 4)
  mixing_epsilon: 0.01  # mixing time stops when every row of P^n is within 1pp TVD of the stationary vector
  homogeneity_periods: 2  # two halves of the ~125-label stride sequence keep enough transitions per row for the chi-square approximation (Fix 4)
  seed: 0               # explicit RNG seed for every null model and bootstrap; change to check sensitivity

hmm:                    # Phase 4 walk-forward HMM (Fix 5); min_train is backtest.min_train
  seeds: [0, 1, 2]      # Baum-Welch restarts, best log-likelihood kept; Phase 1 found ~40% of seeds reach the optimum
  n_iter: 200           # Baum-Welch iteration cap, the companion default
  emission: gaussian    # gaussian | student_t | auto; auto evaluates Student-t only when a single-outlier crash state appears
  enter: 0.6            # hysteresis: enter a regime above this filtered probability (Fix 5)
  exit: 0.4             # ... leave it below this (Fix 5)
  confirm_bars: 2       # bars the probability must hold before the decision flips (Fix 5: 2 to 3)
  refit_every: 21       # refit monthly on past data only (Fix 5)
  train_bars: 2520      # sliding training window, ~10 trading years (Fix 5)
  vol_short: 10         # 10-day realised volatility feature
  vol_long: 20          # 20-day realised volatility feature, the labeller window
  match_window: 20      # a flip is matched to the other detector's flip within +/-20 bars (agreement report)

costs:                  # fee/slippage are per-side bps on |delta position|; borrow/funding are annual bps (Fix 6)
  profiles:
    us_etfs:
      fee_bps: 1        # section 5: 1 bps fee for liquid US ETFs
      slippage_bps: 2   # section 5: 2 bps slippage for liquid US ETFs
      borrow_bps: 30    # annual general-collateral borrow on short ETF notional, typical for liquid names (Fix 6)
      funding_bps: 0    # spot ETFs carry no perpetual funding
    crypto:
      fee_bps: 10       # section 5: 10 bps fee for crypto
      slippage_bps: 10  # section 5: 10 bps slippage for crypto
      borrow_bps: 0     # spot crypto has no borrow desk; shorts are expressed through perps (see funding_bps)
      funding_bps: 0    # spot has none; perpetual futures funding runs roughly 1000 bps a year, set that if trading perps

daily:                  # Phase 7 daily job: recompute regimes for a watchlist and write a signal file, nothing more
  universe: us_etfs     # watchlist the daily job scans by default (config/universes/)
  webhooks_dir: webhooks  # registration files for run-summary consumers; real files are git-ignored
  signal_file: signal.json        # per-run signal file under jobs/<run_id>/
  latest_file: signal_latest.json # stable copy under jobs/ that `hedgefund propose` reads

paper:                  # Phase 7 sizing helper: turns signal into a proposal that is printed, never submitted
  max_gross: 1.0        # cap on total |weight| in a proposal; 1.0 = unlevered
  allow_short: true     # a Bear signal proposes a short; false proposes flat
  min_trade_notional: 1.0  # skip proposed orders under $1 (dust)
  rule: sign            # position rule for proposals: sign | conviction | persistence | long_only; same default as backtest.rule

universe: us_etfs       # default universe file under config/universes/
